<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f7f5">
<title>AI Wrapped Year</title>
<meta name="description" content="Your year with AI coding tools, as a story you can share. Made on your machine from the logs your tools already keep.">
<meta property="og:title" content="AI Wrapped Year">
<meta property="og:description" content="Your year with AI coding tools, as a story you can share. Made on your machine from the logs your tools already keep.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://aiyearwrapped.com/">
<link rel="canonical" href="https://aiyearwrapped.com/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232438e8'/%3E%3Cg fill='none' stroke-width='4.5' stroke-linejoin='miter' stroke-linecap='square'%3E%3Cpath d='M7 10l4 13 5-9 5 9 4-13' stroke='%23ff5c93' transform='translate(1.5 1.5)'/%3E%3Cpath d='M7 10l4 13 5-9 5 9 4-13' stroke='%23ffd23f'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&display=swap">
<style>
  /* The wrap's inks on paper. Blue carries the page; pink only prints the year's offset.
     Avenir Next on Apple devices, Barlow Condensed elsewhere. */
  :root {
    --paper: #f7f7f5;
    --ink: #14205c;
    --blue: #2438e8;
    --pink: #ff5c93;
    --display: "Avenir Next Condensed", "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif;
    --text: "Avenir Next", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --gutter: clamp(16px, 5vw, 72px);
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--text); font-size: 18px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-underline-offset: 0.18em; text-decoration-thickness: 0.08em; }
  a:hover { color: var(--blue); }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 0.92em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .band { padding: clamp(48px, 7vw, 96px) var(--gutter); }
  .pink { --over: var(--pink); }
  .inner { max-width: 1180px; margin: 0 auto; }

  /* As in the wrap: type printed twice, slightly out of register, the second ink under the first. */
  .riso { position: relative; isolation: isolate; display: inline-block; font-family: var(--display); font-weight: 900; line-height: 0.86; letter-spacing: -0.01em; }
  .riso::after {
    content: attr(data-text);
    content: attr(data-text) / "";
    position: absolute;
    inset: 0;
    z-index: -1;
    color: var(--over);
    transform: translate(0.045em, 0.035em);
  }
  @media (prefers-reduced-motion: no-preference) {
    .hero .riso::after { animation: register 0.6s 0.2s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
    @keyframes register { from { transform: none; } }
  }

  .hero { min-height: 100svh; display: grid; align-items: center; padding-top: 32px; padding-bottom: 48px; }
  .hero .inner { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: clamp(32px, 6vw, 96px); align-items: center; width: 100%; }
  .lead { font-size: clamp(30px, 4.4vw, 56px); font-weight: 600; line-height: 1.1; }
  .year { color: var(--blue); font-size: clamp(130px, 21vw, 300px); margin: 0.04em 0 0.08em -0.04em; }
  .about { max-width: 30ch; margin-top: 28px; font-size: clamp(19px, 1.7vw, 22px); }

  .ways { display: flex; flex-wrap: wrap; gap: 4px 24px; margin-top: 36px; }
  .ways button { padding: 6px 0; border: 0; border-bottom: 3px solid transparent; background: none; color: inherit; font: 700 17px var(--text); cursor: pointer; touch-action: manipulation; }
  .ways button:hover { color: var(--blue); }
  .ways [aria-pressed="true"] { border-color: var(--blue); color: var(--blue); }
  .run { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px; margin-top: 14px; }
  .cmd { display: flex; align-items: center; min-width: 0; min-height: 56px; padding: 10px 22px; overflow-wrap: anywhere; border: 2px solid currentColor; font-size: clamp(17px, 1.8vw, 21px); font-weight: 600; user-select: all; }
  .cmd::before { content: "$"; margin-right: 0.6em; opacity: 0.55; user-select: none; }
  .copy { min-height: 56px; min-width: 104px; padding: 0 22px; border: 0; background: var(--blue); color: var(--paper); font: 700 18px var(--text); cursor: pointer; touch-action: manipulation; }
  .copy:hover { background: var(--ink); }
  .needs { margin-top: 14px; font-size: 15px; }

  /* The demo is the real page, so it plays, taps and shares like a wrap does. It is the only full-colour thing here. */
  figure { display: grid; gap: 12px; justify-items: center; }
  .phone { display: block; width: auto; height: min(80svh, 760px); aspect-ratio: 9 / 16; border: 0; background: var(--ink); box-shadow: 14px 14px 0 var(--pink); }
  figcaption { font-size: 15px; }

  footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px 32px; width: min(1180px, 100% - 2 * var(--gutter)); margin: 0 auto; padding: 28px 0 40px; border-top: 3px solid; font-size: 16px; }
  footer nav { display: flex; flex-wrap: wrap; gap: 8px 28px; }

  @media (max-width: 860px) {
    .hero { min-height: 0; }
    .hero .inner { grid-template-columns: minmax(0, 1fr); }
    .phone { width: min(100%, 420px); height: auto; box-shadow: 10px 10px 0 var(--over); }
    figure { margin-right: 10px; }
  }
</style>
</head>
<body>
<main>
  <section class="band pink hero">
    <div class="inner">
      <div>
        <h1>
          <span class="lead">Your</span><br>
          <span class="riso year" id="year" data-text="2026">2026</span><br>
          <span class="lead">with AI</span>
        </h1>
        <p class="about">A story of your year with AI coding tools, made from the logs they already keep on your machine.</p>
        <div class="ways" role="group" aria-label="How to run it" translate="no">
          <button type="button" aria-pressed="true" data-cmd="npx ai-wrapped-year" data-needs="Needs Node 22.13 or newer.">npx</button>
          <button type="button" aria-pressed="false" data-cmd="pnpm dlx ai-wrapped-year" data-needs="Needs Node 22.13 or newer.">pnpm</button>
          <button type="button" aria-pressed="false" data-cmd="bunx --bun ai-wrapped-year" data-needs="Runs on Bun. No Node needed.">Bun</button>
          <button type="button" aria-pressed="false" data-cmd="brew install iamdejman/tap/ai-wrapped-year" data-needs="Then run ai-wrapped-year. Homebrew installs Node for you.">Homebrew</button>
        </div>
        <div class="run">
          <code class="cmd" id="cmd" translate="no">npx ai-wrapped-year</code>
          <button class="copy" id="copy" type="button">Copy</button>
          <span class="sr" id="said" role="status"></span>
        </div>
        <p class="needs" id="needs">Needs Node 22.13 or newer.</p>
      </div>
      <figure>
        <iframe class="phone" src="demo.html#2" title="A demo wrap with made-up numbers"></iframe>
        <figcaption>A demo wrap. Tap to go forward and back.</figcaption>
      </figure>
    </div>
  </section>
</main>
<footer>
  <span>MIT license</span>
  <nav>
    <a href="https://github.com/IamDejman/ai-wrapped-year">GitHub</a>
    <a href="https://www.npmjs.com/package/ai-wrapped-year">npm</a>
    <a href="https://github.com/IamDejman/ai-wrapped-year/issues">Report a problem</a>
  </nav>
</footer>
<script>
  // The year the command wraps: this year, or last year during January.
  const now = new Date();
  const year = String(now.getFullYear() - (now.getMonth() === 0 ? 1 : 0));
  const big = document.getElementById('year');
  big.textContent = year;
  big.dataset.text = year;

  const cmd = document.getElementById('cmd');
  const needs = document.getElementById('needs');
  const ways = document.querySelectorAll('.ways button');
  for (const way of ways) {
    way.addEventListener('click', () => {
      for (const w of ways) w.setAttribute('aria-pressed', String(w === way));
      cmd.textContent = way.dataset.cmd;
      needs.textContent = way.dataset.needs;
    });
  }

  const copy = document.getElementById('copy');
  const said = document.getElementById('said');
  copy.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(document.getElementById('cmd').textContent);
      copy.textContent = 'Copied';
    } catch {
      getSelection().selectAllChildren(document.getElementById('cmd'));
      copy.textContent = /Mac|iPhone|iPad/.test(navigator.platform) ? 'Press ⌘C' : 'Press Ctrl+C';
    }
    said.textContent = copy.textContent;
    setTimeout(() => (copy.textContent = 'Copy', said.textContent = ''), 2000);
  });
</script>
</body>
</html>
